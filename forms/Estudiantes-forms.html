<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>sgc</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="forms/form-style.css">
</head>

<body>
  <h1>Estudiantes</h1>
  <a href="#modal-estudiante" class="add-bnt">Crear</a>
  <div id="modal-estudiante" class="modal">
    <div class="container-forms">
      <form class="formulario">
        <h2 class="title-forms">Crear Estudiantes</h2>
        <div class="form-group input">
          <label for="name">Nombre:</label>
          <input type="text" id="name" name="name" placeholder="Nombre">

          <label for="last_name">Apellido:</label>
          <input type="text" id="last_name" name="last_name" placeholder="Apellido">

          <label for="email">Correo:</label>
          <input type="email" id="email" name="email" placeholder="Correo">

          <label for="phone">Telefono:</label>
          <input type="text" id="phone" name="phone" placeholder="Telefono">
        </div>

        <div class="btns">
          <button type="submit" class="add-bnt">Crear</button>
          <a href="#" class="cancelar-bnt">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</body>

</html>
